
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)']],
    displayMath: [['\\[','\\]']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
:root {
  --blue:#3978b9;
  --blue-dark:#245987;
  --blue-light:#eaf3fc;
  --bg:#f4f7fb;
  --border:#e2e9f1;
  --text:#26384b;
  --muted:#7d8da0;
  --white:#fff;
  --gold:#c49b50;
  --danger:#d9534f;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea { font:inherit; }
button {
  border:0;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  background:var(--blue);
  color:white;
}
button.secondary { background:#e9f0f7;color:var(--blue-dark); }
button.danger { background:#fff0ef;color:var(--danger); }
button:disabled { opacity:.5;cursor:not-allowed; }
input,select,textarea {
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px;
  background:white;
  color:var(--text);
  margin-top:6px;
}
textarea { min-height:90px;resize:vertical; }
label { display:block;font-size:14px;font-weight:600;margin:12px 0; }
small,.muted { color:var(--muted); }
header {
  background:white;
  border-bottom:1px solid var(--border);
  padding:15px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:5;
}
.brand { font-weight:800;color:var(--blue-dark);font-size:20px; }
main { max-width:1100px;margin:25px auto;padding:0 16px 60px; }
.panel {
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 14px #26384b08;
}
h1 { font-size:25px;margin:0 0 18px; }
h2 { font-size:19px;margin:0 0 15px; }
h3 { font-size:16px; }
.tabs { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px; }
.tabs button { background:#e9f0f7;color:var(--blue-dark); }
.tabs button.active { background:var(--blue);color:white; }
.grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px; }
.actions { display:flex;gap:8px;flex-wrap:wrap;margin-top:12px; }
.item {
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}
.badge {
  display:inline-block;
  border-radius:20px;
  background:var(--blue-light);
  color:var(--blue-dark);
  padding:4px 9px;
  font-size:12px;
}
.hidden { display:none!important; }
#login {
  max-width:430px;
  margin:9vh auto;
  padding:28px;
}
#login .brand { font-size:27px;margin-bottom:8px; }
#message {
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#26384b;
  color:white;
  border-radius:10px;
  padding:12px 18px;
  z-index:20;
  display:none;
  max-width:90%;
}
.question {
  border:1px solid var(--border);
  border-radius:12px;
  padding:17px;
  margin:14px 0;
}
.option {
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px;
  background:#f7f9fc;
  border-radius:9px;
  margin:7px 0;
  font-weight:400;
}
.option input { width:auto;margin:3px 0 0; }
.timer {
  position:sticky;
  top:65px;
  z-index:3;
  background:#fff8e9;
  color:#906b25;
  padding:12px;
  border-radius:10px;
  font-weight:800;
  text-align:center;
}
table { width:100%;border-collapse:collapse; }
th,td { padding:10px;border-bottom:1px solid var(--border);text-align:left;font-size:14px; }
@media(max-width:650px) {
  .grid { grid-template-columns:1fr; }
  header { padding:12px; }
  main { margin:16px auto; }
  .panel { padding:15px; }
  table { display:block;overflow-x:auto; }
}
</style>
</head>

<body>

<header>
  <div class="brand">Test System</div>
  <div id="userBar" class="hidden">
    <span id="userName"></span>
    <button class="secondary" onclick="logout()">登出</button>
  </div>
</header>

<section id="login" class="panel">
  <div class="brand">Test System</div>
  <p class="muted">線上測驗與題庫管理平台</p>

  <label>帳號
    <input id="loginUsername" autocomplete="username" placeholder="請輸入帳號">
  </label>
  <label>密碼
    <input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼">
  </label>
  <button style="width:100%" onclick="login()">登入</button>
</section>

<main id="app" class="hidden">
  <div id="teacherArea" class="hidden">
    <h1>教師管理中心</h1>
    <div class="tabs">
      <button class="active" onclick="teacherTab('home',this)">總覽</button>
      <button onclick="teacherTab('questions',this)">題庫管理</button>
      <button onclick="teacherTab('exams',this)">測驗管理</button>
      <button onclick="teacherTab('results',this)">成績統計</button>
    </div>

    <section id="t-home" class="panel">
      <h2>教師總覽</h2>
      <p>歡迎使用 Test System。</p>
      <div class="grid">
        <div class="item"><h3>題庫</h3><p id="questionCount">載入中</p></div>
        <div class="item"><h3>測驗</h3><p id="examCount">載入中</p></div>
      </div>
    </section>

    <section id="t-questions" class="hidden">
      <div class="panel">
        <h2>新增題目</h2>
        <label>科目
          <select id="qSubject">
            <option>國文</option><option>英文</option>
            <option>數學</option><option>自然</option>
            <option>地理</option><option>歷史</option><option>公民</option>
          </select>
        </label>
        <label>單元
          <input id="qUnit" placeholder="例如：3-1 推理與證明">
        </label>
        <label>題型
          <select id="qType">
            <option value="single">單選題</option>
            <option value="multiple">多選題</option>
          </select>
        </label>
        <label>題目內容（支援 LaTeX）
          <textarea id="qContent" placeholder="輸入題目，可使用 \(公式\) 或 \[公式\]"></textarea>
        </label>
        <div id="optionsEditor"></div>
        <div class="actions">
          <button class="secondary" onclick="addOption()">新增選項</button>
        </div>
        <label>正確答案（填選項編號，例如 1；多選填 1,3）
          <input id="qAnswer" placeholder="例如：2">
        </label>
        <label>解析
          <textarea id="qExplanation"></textarea>
        </label>
        <label>題目圖片
          <input type="file" id="qImage" accept="image/png,image/jpeg,image/webp,image/gif">
        </label>
        <button onclick="saveQuestion()">儲存題目</button>
      </div>

      <div class="panel">
        <h2>題庫列表</h2>
        <div class="grid">
          <label>科目
            <select id="filterSubject" onchange="loadQuestions()">
              <option value="">全部</option>
              <option>國文</option><option>英文</option>
              <option>數學</option><option>自然</option>
              <option>地理</option><option>歷史</option><option>公民</option>
            </select>
          </label>
          <label>單元
            <input id="filterUnit" placeholder="輸入單元關鍵字" oninput="filterQuestionList()">
          </label>
        </div>
        <div id="questionList"></div>
      </div>
    </section>

    <section id="t-exams" class="hidden">
      <div class="panel">
        <h2>建立測驗</h2>
        <label>測驗名稱
          <input id="examTitle" placeholder="例如：3-1 推理與證明（進階）">
        </label>
        <label>科目
          <select id="examSubject">
            <option>國文</option><option>英文</option>
            <option>數學</option><option>自然</option>
            <option>地理</option><option>歷史</option><option>公民</option>
          </select>
        </label>
        <label>測驗單元（可輸入多個，以逗號分隔）
          <input id="examUnits" placeholder="3-1 推理與證明, 3-2 統計">
        </label>
        <label>作答時間（分鐘）
          <input id="examDuration" type="number" min="1" value="30">
        </label>
        <div class="grid">
          <label>開始時間
            <input id="examStart" type="datetime-local">
          </label>
          <label>截止時間
            <input id="examEnd" type="datetime-local">
          </label>
        </div>
        <label>選擇題目
          <div id="examQuestionPicker"></div>
        </label>
        <button onclick="createExam()">建立測驗</button>
      </div>

      <div class="panel">
        <h2>測驗列表</h2>
        <div id="examList"></div>
      </div>
    </section>

    <section id="t-results" class="hidden">
      <div class="panel">
        <h2>成績統計</h2>
        <label>選擇測驗
          <select id="resultExam" onchange="loadResults()"></select>
        </label>
        <div id="resultsTable"></div>
        <h3>題目答對率</h3>
        <div id="questionStats"></div>
      </div>
    </section>
  </div>

  <div id="studentArea" class="hidden">
    <h1>學生測驗中心</h1>
    <div class="tabs">
      <button class="active" onclick="studentTab('available',this)">可作答測驗</button>
      <button onclick="studentTab('history',this)">測驗紀錄</button>
    </div>
    <section id="s-available" class="panel">
      <h2>我的測驗</h2>
      <div id="assignedExams"></div>
    </section>
    <section id="s-history" class="panel hidden">
      <h2>測驗紀錄</h2>
      <div id="studentHistory"></div>
    </section>
    <section id="takingExam" class="panel hidden">
      <div class="timer" id="timer">剩餘時間：--:--</div>
      <h2 id="takingTitle"></h2>
      <div id="takingQuestions"></div>
      <button onclick="submitCurrentExam()">交卷</button>
    </section>
    <section id="reviewArea" class="panel hidden">
      <h2>測驗檢討</h2>
      <div id="reviewContent"></div>
    </section>
  </div>
</main>

<div id="message"></div>

<script>
const SUPABASE_URL = "https://engbrxllahnciuysupxh.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_PUBLISHABLE_KEY";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let questions = [];
let exams = [];
let activeAttempt = null;
let activeExam = null;
let activeQuestions = [];
let savedAnswers = {};
let deadlineAt = null;
let timerHandle = null;
let optionCount = 4;

function notify(message) {
  const el = document.getElementById('message');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(notify.timer);
  notify.timer = setTimeout(() => el.style.display = 'none', 3500);
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function localDateValue(value) {
  if (!value) return null;
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? null : date.toISOString();
}

async function login() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) return notify('請輸入帳號與密碼');

  const email = username.includes('@') ? username : username + '@test-system.example.com';
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) return notify(error.message);
  await initialize(data.user);
}

async function initialize(user) {
  currentUser = user;
  const { data, error } = await db.from('profiles')
    .select('id,username,display_name,role')
    .eq('id', user.id)
    .single();

  if (error || !data) {
    await db.auth.signOut();
    return notify('找不到使用者資料，請聯絡教師');
  }

  currentProfile = data;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBar').classList.remove('hidden');
  document.getElementById('userName').textContent =
    data.display_name || data.username || '使用者';

  if (data.role === 'teacher') {
    document.getElementById('teacherArea').classList.remove('hidden');
    await loadTeacherHome();
  } else if (data.role === 'student') {
    document.getElementById('studentArea').classList.remove('hidden');
    await loadAssignedExams();
    await loadStudentHistory();
  } else {
    notify('帳號角色設定不正確');
  }
}

async function logout() {
  clearInterval(timerHandle);
  await db.auth.signOut();
  location.reload();
}

async function restoreSession() {
  const { data } = await db.auth.getSession();
  if (data.session?.user) await initialize(data.session.user);
}

function teacherTab(name, button) {
  ['home','questions','exams','results'].forEach(x =>
    document.getElementById('t-' + x).classList.toggle('hidden', x !== name)
  );
  document.querySelectorAll('#teacherArea .tabs button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');

  if (name === 'questions') loadQuestions();
  if (name === 'exams') loadExams();
  if (name === 'results') loadExamOptions();
}

function studentTab(name, button) {
  ['available','history'].forEach(x =>
    document.getElementById('s-' + x).classList.toggle('hidden', x !== name)
  );
  document.getElementById('takingExam').classList.add('hidden');
  document.getElementById('reviewArea').classList.add('hidden');
  document.querySelectorAll('#studentArea .tabs button').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  if (name === 'available') loadAssignedExams();
  else loadStudentHistory();
}

async function loadTeacherHome() {
  const q = await db.from('questions').select('id', {count:'exact',head:true});
  const e = await db.from('exams').select('id', {count:'exact',head:true});
  document.getElementById('questionCount').textContent = q.count ?? '—';
  document.getElementById('examCount').textContent = e.count ?? '—';
}

function renderOptionEditor() {
  const el = document.getElementById('optionsEditor');
  el.innerHTML = '';
  for (let i=0;i<optionCount;i++) {
    el.innerHTML += `
      <label>選項 ${i+1}
        <input class="q-option" placeholder="輸入選項內容">
      </label>`;
  }
}

function addOption() {
  if (optionCount >= 10) return notify('最多 10 個選項');
  optionCount++;
  renderOptionEditor();
}

async function saveQuestion() {
  const content = document.getElementById('qContent').value.trim();
  const options = [...document.querySelectorAll('.q-option')].map(x=>x.value.trim());
  if (!content || options.some(x=>!x)) return notify('請完整填寫題目及選項');

  const rawAnswer = document.getElementById('qAnswer').value.trim();
  const indexes = rawAnswer.split(',').map(x=>Number(x.trim())-1);
  if (!rawAnswer || indexes.some(x=>!Number.isInteger(x)||x<0||x>=options.length))
    return notify('正確答案格式不正確');

  const type = document.getElementById('qType').value;
  if (type === 'single' && indexes.length !== 1) return notify('單選題只能有一個答案');

  let imageUrl = null;
  const file = document.getElementById('qImage').files[0];
  if (file) {
    if (file.size > 10 * 1024 * 1024) return notify('圖片不可超過 10MB');
    const ext = file.name.split('.').pop().toLowerCase();
    const path = `${currentUser.id}/${crypto.randomUUID()}.${ext}`;
    const { error: uploadError } = await db.storage
      .from('test-question-images')
      .upload(path,file,{upsert:false,contentType:file.type});
    if (uploadError) return notify('圖片上傳失敗：' + uploadError.message);
    imageUrl = db.storage.from('test-question-images').getPublicUrl(path).data.publicUrl;
  }

  const payload = {
    subject:document.getElementById('qSubject').value,
    unit:document.getElementById('qUnit').value.trim() || null,
    question_type:type,
    content,
    options,
    correct_answer:type === 'single' ? indexes[0] : indexes,
    explanation:document.getElementById('qExplanation').value,
    image_url:imageUrl,
    created_by:currentUser.id
  };

  const { error } = await db.from('questions').insert(payload);
  if (error) return notify('儲存失敗：' + error.message);

  notify('題目已儲存');
  document.getElementById('qContent').value = '';
  document.getElementById('qAnswer').value = '';
  document.getElementById('qExplanation').value = '';
  document.getElementById('qImage').value = '';
  await loadQuestions();
}

async function loadQuestions() {
  const subject = document.getElementById('filterSubject').value;
  let query = db.from('questions')
    .select('id,subject,unit,question_type,content,options,correct_answer,explanation,image_url')
    .order('created_at',{ascending:false});
  if (subject) query = query.eq('subject',subject);
  const {data,error} = await query;
  if (error) return notify(error.message);
  questions = data || [];
  renderQuestions();
  renderExamQuestionPicker();
}

function renderQuestions() {
  const keyword = document.getElementById('filterUnit').value.trim().toLowerCase();
  const filtered = questions.filter(q => !keyword || (q.unit||'').toLowerCase().includes(keyword));
  document.getElementById('questionList').innerHTML = filtered.map(q=>`
    <div class="item">
      <span class="badge">${escapeHtml(q.subject)}</span>
      <span class="badge">${escapeHtml(q.unit||'未分類')}</span>
      <p>${escapeHtml(q.content)}</p>
      <small>${q.question_type === 'multiple' ? '多選題':'單選題'} · ${q.options.length} 個選項</small>
      <div class="actions">
        <button class="danger" onclick="deleteQuestion('${q.id}')">刪除</button>
      </div>
    </div>
  `).join('') || '<p class="muted">目前沒有題目</p>';
  if (window.MathJax) MathJax.typesetPromise();
}

function filterQuestionList() { renderQuestions(); }

async function deleteQuestion(id) {
  if (!confirm('確定刪除此題？若已被測驗使用，資料庫可能會拒絕刪除。')) return;
  const {error} = await db.from('questions').delete().eq('id',id);
  if (error) return notify(error.message);
  notify('已刪除');
  await loadQuestions();
}

function renderExamQuestionPicker() {
  document.getElementById('examQuestionPicker').innerHTML = questions.map(q=>`
    <label class="option">
      <input type="checkbox" class="exam-q-check" value="${q.id}">
      <span>${escapeHtml(q.unit||'未分類')}｜${escapeHtml(q.content.slice(0,100))}</span>
    </label>
  `).join('') || '<p class="muted">請先建立題目</p>';
}

async function createExam() {
  const title = document.getElementById('examTitle').value.trim();
  const duration = Number(document.getElementById('examDuration').value);
  const selected = [...document.querySelectorAll('.exam-q-check:checked')].map(x=>x.value);
  if (!title || !Number.isInteger(duration) || duration < 1 || !selected.length)
    return notify('請填寫測驗名稱、時間並選擇題目');

  const start = localDateValue(document.getElementById('examStart').value);
  const end = localDateValue(document.getElementById('examEnd').value);
  if (start && end && new Date(end) <= new Date(start))
    return notify('截止時間必須晚於開始時間');

  const units = document.getElementById('examUnits').value
    .split(',').map(x=>x.trim()).filter(Boolean);

  const {data:exam,error} = await db.from('exams').insert({
    title,
    subject:document.getElementById('examSubject').value,
    units,
    duration_minutes:duration,
    start_at:start,
    end_at:end,
    is_published:false,
    show_answers:false,
    created_by:currentUser.id
  }).select().single();

  if (error) return notify('建立測驗失敗：'+error.message);

  const links = selected.map((id,index)=>({
    exam_id:exam.id,
    question_id:id,
    question_order:index+1,
    points:1
  }));

  const {error:linkError} = await db.from('exam_questions').insert(links);
  if (linkError) {
    await db.from('exams').delete().eq('id',exam.id);
    return notify('題目加入失敗：'+linkError.message);
  }

  notify('測驗建立成功，尚未發布');
  await loadExams();
}

async function loadExams() {
  const {data,error} = await db.from('exams')
    .select('id,title,subject,units,duration_minutes,start_at,end_at,is_published')
    .order('created_at',{ascending:false});
  if (error) return notify(error.message);
  exams = data || [];
  document.getElementById('examList').innerHTML = exams.map(e=>`
    <div class="item">
      <h3>${escapeHtml(e.title)}</h3>
      <p>${escapeHtml(e.subject)} · ${e.duration_minutes} 分鐘</p>
      <p class="muted">單元：${escapeHtml((e.units||[]).join('、')||'未指定')}</p>
      <span class="badge">${e.is_published?'已發布':'未發布'}</span>
      <div class="actions">
        <button onclick="togglePublish('${e.id}',${!e.is_published})">${e.is_published?'取消發布':'發布'}</button>
        <button class="secondary" onclick="printExam('${e.id}',false)">學生版列印</button>
        <button class="secondary" onclick="printExam('${e.id}',true)">教師版列印</button>
      </div>
    </div>
  `).join('') || '<p class="muted">尚無測驗</p>';
}

async function togglePublish(id,value) {
  const {error} = await db.from('exams').update({is_published:value}).eq('id',id);
  if (error) return notify(error.message);
  notify(value?'測驗已發布':'已取消發布');
  await loadExams();
}

async function printExam(id,withAnswers) {
  const {data:exam,error:eError} = await db.from('exams')
    .select('*').eq('id',id).single();
  if (eError) return notify(eError.message);

  const {data:links,error:lError} = await db.from('exam_questions')
    .select('question_id,question_order,points')
    .eq('exam_id',id).order('question_order');
  if (lError) return notify(lError.message);

  const ids = links.map(x=>x.question_id);
  const {data:qs,error:qError} = await db.from('questions')
    .select('*').in('id',ids);
  if (qError) return notify(qError.message);

  const map = Object.fromEntries(qs.map(q=>[q.id,q]));
  const html = links.map((link,index)=>{
    const q = map[link.question_id];
    const options = (q.options||[]).map((o,i)=>
      `<p>${i+1}. ${escapeHtml(o)}</p>`).join('');
    const answer = withAnswers
      ? `<p><b>正確答案：</b>${escapeHtml(JSON.stringify(q.correct_answer))}</p>
         <p><b>解析：</b>${escapeHtml(q.explanation||'無')}</p>` : '';
    const image = q.image_url ? `<img src="${escapeHtml(q.image_url)}" style="max-width:100%;max-height:260px">` : '';
    return `<article style="page-break-inside:avoid;margin:20px 0">
      <b>${index+1}. ${escapeHtml(q.content)}</b>${image}${options}${answer}
    </article>`;
  }).join('');

  const w = window.open('','_blank');
  if (!w) return notify('瀏覽器封鎖新視窗，請允許彈出視窗');
  w.document.write(`
    <!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8">
    <title>${escapeHtml(exam.title)}</title>
    <style>
    body{font-family:Arial,sans-serif;padding:25px;color:#222}
    @page{size:A4;margin:18mm}
    article{line-height:1.7}
    </style></head><body>
    <h1>${escapeHtml(exam.title)}</h1>
    <p>${escapeHtml(exam.subject)}　作答時間：${exam.duration_minutes} 分鐘</p>
    ${html}
    <script>window.onload=()=>setTimeout(()=>window.print(),700)<\/script>
    </body></html>`);
  w.document.close();
}

async function loadExamOptions() {
  await loadExams();
  document.getElementById('resultExam').innerHTML =
    '<option value="">請選擇測驗</option>' +
    exams.map(e=>`<option value="${e.id}">${escapeHtml(e.title)}</option>`).join('');
}

async function loadResults() {
  const id = document.getElementById('resultExam').value;
  if (!id) return;
  const [resultResponse,statsResponse] = await Promise.all([
    db.rpc('get_exam_results',{p_exam_id:id}),
    db.rpc('get_exam_question_stats',{p_exam_id:id})
  ]);
  if (resultResponse.error) return notify(resultResponse.error.message);
  if (statsResponse.error) return notify(statsResponse.error.message);

  const rows = resultResponse.data || [];
  document.getElementById('resultsTable').innerHTML = `
    <table><thead><tr><th>學生</th><th>分數</th><th>狀態</th><th>交卷時間</th><th>操作</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr>
        <td>${escapeHtml(r.student_name)}</td>
        <td>${r.score??'—'} / ${r.total_points??'—'}</td>
        <td>${escapeHtml(r.status)}</td>
        <td>${r.submitted_at?new Date(r.submitted_at).toLocaleString():'—'}</td>
        <td>${r.status==='submitted'?`<button class="danger" onclick="deleteAttempt('${r.attempt_id}')">刪除作答</button>`:''}</td>
      </tr>`).join('')}</tbody></table>`;

  document.getElementById('questionStats').innerHTML =
    (statsResponse.data||[]).map(s=>`
      <div class="item">
        <b>第 ${s.question_order} 題</b>
        <p>${escapeHtml(s.question_content.slice(0,130))}</p>
        <p>作答：${s.submitted_count} 人　答對：${s.correct_count} 人　答錯：${s.incorrect_count} 人</p>
        <span class="badge">答對率 ${s.accuracy}%</span>
      </div>`).join('');
}

async function deleteAttempt(id) {
  if (!confirm('確定刪除此學生的作答紀錄？刪除後學生可重新作答。')) return;
  const {error} = await db.from('attempts').delete().eq('id',id);
  if (error) return notify(error.message);
  notify('作答紀錄已刪除');
  await loadResults();
}

async function loadAssignedExams() {
  const {data,error} = await db.rpc('get_assigned_exams');
  if (error) return notify(error.message);
  document.getElementById('assignedExams').innerHTML = (data||[]).map(e=>`
    <div class="item">
      <h3>${escapeHtml(e.title)}</h3>
      <p>${escapeHtml(e.subject)} · ${e.duration_minutes} 分鐘</p>
      <p class="muted">${e.start_at?'開始：'+new Date(e.start_at).toLocaleString():''}</p>
      <button onclick="startExam('${e.exam_id}')">開始／繼續測驗</button>
    </div>
  `).join('') || '<p class="muted">目前沒有指派給你的測驗</p>';
}

async function startExam(examId) {
  const {data:attemptId,error} = await db.rpc('start_exam',{p_exam_id:examId});
  if (error) return notify(error.message);

  activeAttempt = attemptId;
  const {data:attempt,error:attemptError} = await db.from('attempts')
    .select('deadline_at,exam_id')
    .eq('id',attemptId).single();
  if (attemptError) return notify(attemptError.message);

  activeExam = examId;
  deadlineAt = attempt.deadline_at;
  if (!deadlineAt) return notify('作答期限資料不存在，請聯絡教師');

  const {data:exam} = await db.from('exams').select('title').eq('id',examId).single();
  document.getElementById('takingTitle').textContent = exam?.title || '線上測驗';

  const {data,error:qError} = await db.rpc('get_exam_questions',{p_attempt_id:attemptId});
  if (qError) return notify(qError.message);
  activeQuestions = data || [];

  const {data:answers,error:aError} = await db.from('answers')
    .select('question_id,selected_answer')
    .eq('attempt_id',attemptId);
  if (aError) return notify(aError.message);

  savedAnswers = {};
  (answers||[]).forEach(a=>savedAnswers[a.question_id]=a.selected_answer);

  document.getElementById('s-available').classList.add('hidden');
  document.getElementById('s-history').classList.add('hidden');
  document.getElementById('reviewArea').classList.add('hidden');
  document.getElementById('takingExam').classList.remove('hidden');

  renderTakingQuestions();
  startTimer();
}

function renderTakingQuestions() {
  document.getElementById('takingQuestions').innerHTML = activeQuestions.map((q,index)=>{
    const selected = savedAnswers[q.question_id];
    return `<div class="question">
      <h3>${index+1}. ${escapeHtml(q.content)}</h3>
      ${q.image_url?`<img src="${escapeHtml(q.image_url)}" style="max-width:100%;max-height:260px">`:''}
      ${(q.options||[]).map((option,i)=>{
        const checked = Array.isArray(selected)
          ? selected.includes(i)
          : selected === i;
        return `<label class="option">
          <input type="${q.question_type==='multiple'?'checkbox':'radio'}"
            name="answer-${q.question_id}" value="${i}" ${checked?'checked':''}
            onchange="changeAnswer('${q.question_id}','${q.question_type}')">
          <span>${i+1}. ${escapeHtml(option)}</span>
        </label>`;
      }).join('')}
    </div>`;
  }).join('');
  if (window.MathJax) MathJax.typesetPromise();
}

async function changeAnswer(questionId,type) {
  const inputs = [...document.querySelectorAll(`[name="answer-${questionId}"]:checked`)];
  const value = type === 'multiple'
    ? inputs.map(x=>Number(x.value)).sort((a,b)=>a-b)
    : (inputs.length ? Number(inputs[0].value) : null);

  if (value === null) return;
  savedAnswers[questionId] = value;

  const {error} = await db.rpc('save_exam_answer',{
    p_attempt_id:activeAttempt,
    p_question_id:questionId,
    p_selected_answer:value
  });
  if (error) notify('答案儲存失敗：'+error.message);
}

function startTimer() {
  clearInterval(timerHandle);
  const tick = async () => {
    const remaining = Math.max(0,new Date(deadlineAt).getTime()-Date.now());
    const minutes = Math.floor(remaining/60000);
    const seconds = Math.floor((remaining%60000)/1000);
    document.getElementById('timer').textContent =
      `剩餘時間：${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    if (remaining <= 0) {
      clearInterval(timerHandle);
      notify('作答時間已結束，正在交卷');
      await submitCurrentExam();
    }
  };
  tick();
  timerHandle = setInterval(tick,1000);
}

async function submitCurrentExam() {
  if (!activeAttempt) return;
  if (!confirm('確定要交卷嗎？交卷後不能修改答案。')) return;
  clearInterval(timerHandle);
  const {data,error} = await db.rpc('submit_exam',{p_attempt_id:activeAttempt});
  if (error) {
    notify('交卷失敗：'+error.message);
    return;
  }
  const result = Array.isArray(data)?data[0]:data;
  notify(`交卷完成！成績：${result?.score ?? '—'} / ${result?.total_points ?? '—'}`);
  activeAttempt = null;
  document.getElementById('takingExam').classList.add('hidden');
  await loadStudentHistory();
  studentTab('history',document.querySelector('#studentArea .tabs button:nth-child(2)'));
}

async function loadStudentHistory() {
  const {data,error} = await db.from('attempts')
    .select('id,exam_id,score,total_points,status,started_at,submitted_at,exams(title)')
    .eq('student_id',currentUser.id)
    .order('started_at',{ascending:false});
  if (error) return notify(error.message);

  document.getElementById('studentHistory').innerHTML = (data||[]).map(a=>`
    <div class="item">
      <h3>${escapeHtml(a.exams?.title||'測驗')}</h3>
      <p>${a.status==='submitted'?`成績：${a.score} / ${a.total_points}`:'作答中'}</p>
      ${a.status==='submitted'?`<button onclick="showReview('${a.id}')">查看錯題檢討</button>`:''}
    </div>
  `).join('') || '<p class="muted">尚無測驗紀錄</p>';
}

async function showReview(attemptId) {
  const {data,error} = await db.rpc('get_student_review',{p_attempt_id:attemptId});
  if (error) return notify(error.message);

  document.getElementById('takingExam').classList.add('hidden');
  document.getElementById('s-available').classList.add('hidden');
  document.getElementById('s-history').classList.add('hidden');
  document.getElementById('reviewArea').classList.remove('hidden');

  document.getElementById('reviewContent').innerHTML = (data||[]).map((q,i)=>`
    <div class="question">
      <h3>${i+1}. ${escapeHtml(q.content)}</h3>
      ${(q.options||[]).map((o,j)=>`
        <p>${j+1}. ${escapeHtml(o)}</p>`).join('')}
      <p><b>你的答案：</b>${escapeHtml(JSON.stringify(q.selected_answer??'未作答'))}</p>
      <p><b>正確答案：</b>${escapeHtml(JSON.stringify(q.correct_answer))}</p>
      <p><b>結果：</b>${q.is_correct?'答對':'答錯'}　得分：${q.earned_points}/${q.points}</p>
      <p><b>解析：</b>${escapeHtml(q.explanation||'教師尚未提供解析')}</p>
    </div>
  `).join('');
  if (window.MathJax) MathJax.typesetPromise();
}

function addOptionInit() {
  renderOptionEditor();
}

db.auth.onAuthStateChange((event,session)=>{
  if (event === 'SIGNED_OUT') {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login').classList.remove('hidden');
  }
});

addOptionInit();
restoreSession();
</script>
